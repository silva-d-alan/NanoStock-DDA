version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dda_estoque
    ports:
      - "5433:5432"
    volumes:
      - dda-postgres-data:/var/lib/postgresql/data

volumes:
  dda-postgres-data: